name: Languages

on:
  schedule:
    - cron: "17 5 * * *"   # daily: New is at most a day behind
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["languages.mjs"]

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      - run: node languages.mjs
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - name: Commit when it changed
        run: |
          git add languages
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update languages"
          git pull --rebase -q origin main   # another job may have committed meanwhile
          git push
